specVersion: 1.0.0
description: Aquifer — a reference index for 1inch Aqua shared liquidity on Base
repository: https://github.com/dhruv457457/Bone-Dry
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: base
    source:
      address: "0x1111113ccf1426a8e30e2bff5e005d929bf6a90a"
      abi: Aqua
      startBlock: 48839900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/aqua.ts
      entities: [Protocol, Maker, Strategy, Commitment, MakerTokenPosition]
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
  - kind: ethereum
    name: SwapVM
    network: base
    source:
      address: "0x111111338c5091E8440b67B168bAe16a668AC0De"
      abi: SwapVM
      startBlock: 48839900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/swapvm.ts
      entities: [Fill, Strategy, Maker, Protocol, EncumbranceApplication, MakerTokenPosition]
      abis:
        - name: SwapVM
          file: ./abis/SwapVM.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
        - event: EncumbranceApplied(indexed address,indexed bytes32,indexed address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleEncumbranceApplied
templates:
  - kind: ethereum/contract
    name: Tap
    network: base
    source:
      abi: Tap
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/tap.ts
      entities: [MakerRefusal, Maker, Protocol]
      abis:
        - name: Tap
          file: ./abis/Tap.json
      eventHandlers:
        - event: MakerSkipped(indexed address,indexed bytes32,indexed address,uint256,bytes4)
          handler: handleMakerSkipped
# A Tap data source belongs here once Bone Dry's hook is deployed to Base
# mainnet -- every other data source above targets `network: base` because
# that's what this manifest is. It does not exist there yet (see
# HOOK_ADDRESS / NEXT_PUBLIC_HOOK_ADDRESS in web/lib/networks.ts: mainnet's
# hook is unset). The mapping (src/tap.ts) and schema fields (MakerRefusal,
# Maker.skipsAsMaker, Protocol.skips) are already written and ready --
# what's missing is a manifest to attach them to. A datasource block was
# committed here for a moment pointed at 0xD5Bca5F5Df642E7cfDbA692FE8C3851c89238088
# under `network: base`, which is Base *Sepolia*'s Tap hook, not mainnet's --
# so it would have indexed nothing, forever, with no error to say why.
# Sepolia already has its own Aqua/router/hook trio deployed and its own
# SEPOLIA_GRAPH_URL wired in networks.ts with nothing feeding it; the
# Tap data source belongs in a second manifest targeting `base-sepolia`
# with that trio's real addresses, not bolted onto this one.
