specVersion: 1.0.0
description: Aquifer — a reference index for 1inch Aqua shared liquidity on Base
repository: https://github.com/dhruv457457/Bone-Dry
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: base
    source:
      address: "0x1111113ccf1426a8e30e2bff5e005d929bf6a90a"
      abi: Aqua
      startBlock: 48839900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/aqua.ts
      entities: [Protocol, Maker, Strategy, Commitment, MakerTokenPosition]
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
  - kind: ethereum
    name: SwapVM
    network: base
    source:
      address: "0x111111338c5091E8440b67B168bAe16a668AC0De"
      abi: SwapVM
      startBlock: 48839900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/swapvm.ts
      entities: [Fill, Strategy, Maker, Protocol, EncumbranceApplication, MakerTokenPosition]
      abis:
        - name: SwapVM
          file: ./abis/SwapVM.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
  # BoneDryRouter: SwapVM with opcode 35 appended. The only router that can emit
  # EncumbranceApplied -- the handler used to sit on 1inch's router above, whose
  # opcode table ends at 34, so it could never fire. Deployed at block 51213548
  # (tx 0xd034eb62). First real event: tx 0x95aab656, block 51242689.
  - kind: ethereum
    name: BoneDryRouter
    network: base
    source:
      address: "0x74195573Fa9bC965667e03319F2C58567d4B96BE"
      abi: SwapVM
      startBlock: 51213548
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/swapvm.ts
      entities: [Fill, Strategy, Maker, Protocol, EncumbranceApplication, MakerTokenPosition]
      abis:
        - name: SwapVM
          file: ./abis/SwapVM.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
        - event: EncumbranceApplied(indexed address,indexed bytes32,indexed address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleEncumbranceApplied
  # Both Tap hooks, as plain data sources. Tap used to be declared under
  # `templates:` and nothing ever called TapTemplate.create(), so MakerSkipped was
  # never indexed and MakerRefusal was never written -- silently. Start blocks are
  # the first block each hook has code at, measured on chain.
  - kind: ethereum
    name: Tap
    network: base
    source:
      address: "0xeAdD3C76bB9f3D8Aa26fA9F793A893e2aBa24088"
      abi: Tap
      startBlock: 51140916
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/tap.ts
      entities: [MakerRefusal, Maker, Protocol]
      abis:
        - name: Tap
          file: ./abis/Tap.json
      eventHandlers:
        - event: MakerSkipped(indexed address,indexed bytes32,indexed address,uint256,bytes4)
          handler: handleMakerSkipped
  - kind: ethereum
    name: TapBoneDry
    network: base
    source:
      address: "0xaC7bCA41EA8Fce76651684943Db2c38003c98088"
      abi: Tap
      startBlock: 51213977
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/tap.ts
      entities: [MakerRefusal, Maker, Protocol]
      abis:
        - name: Tap
          file: ./abis/Tap.json
      eventHandlers:
        - event: MakerSkipped(indexed address,indexed bytes32,indexed address,uint256,bytes4)
          handler: handleMakerSkipped
